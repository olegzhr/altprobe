# =========================================================
# MCP / LLM SECURITY RULESET
# Compatible with ModSecurity + OWASP CRS pipeline
# =========================================================

SecRuleEngine On

# =========================================================
# 1. LLM_RESPONSE_INJECTION 5001-5012
# =========================================================

SecRule RESPONSE_BODY "@rx (?i)ignore previous instructions" "id:5001,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)ignore all previous" "id:5002,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)disregard previous instructions" "id:5003,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)you are now" "id:5004,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)act as" "id:5005,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)new instructions:" "id:5006,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)override instructions" "id:5007,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)bypass safety" "id:5008,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)disable filters" "id:5009,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)jailbreak" "id:5010,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)developer mode enabled" "id:5011,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"
SecRule RESPONSE_BODY "@rx (?i)do anything now" "id:5012,phase:4,pass,msg:'LLM_RESPONSE_INJECTION'"

# =========================================================
# 2. LLM_SYSTEM_PROMPT_LEAK 5101-5112
# =========================================================

SecRule RESPONSE_BODY "@rx (?i)system prompt" "id:5101,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)hidden prompt" "id:5102,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)internal instructions" "id:5103,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)assistant instructions" "id:5104,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)developer message" "id:5105,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)you are chatgpt" "id:5106,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)you are an ai model" "id:5107,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)openai policy" "id:5108,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)anthropic policy" "id:5109,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)model instructions" "id:5110,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)confidential prompt" "id:5111,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"
SecRule RESPONSE_BODY "@rx (?i)prompt template" "id:5112,phase:4,pass,msg:'LLM_SYSTEM_PROMPT_LEAK'"

# =========================================================
# 3. LLM_SECRET_EXFILTRATION 5201-5213
# =========================================================


SecRule RESPONSE_BODY "@rx (?i)api[_-]?key\s*[:=]" "id:5201,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)secret\s*[:=]" "id:5202,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)token\s*[:=]" "id:5203,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)password\s*[:=]" "id:5204,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)access[_-]?token" "id:5205,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)bearer\s+[a-z0-9\-_\.]+" "id:5206,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)sk-[a-z0-9]{20,}" "id:5207,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)ghp_[a-z0-9]{20,}" "id:5208,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)xoxb-[a-z0-9-]{20,}" "id:5209,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)private[_-]?key" "id:5210,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)aws_secret_access_key" "id:5211,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)BEGIN RSA PRIVATE KEY" "id:5212,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"
SecRule RESPONSE_BODY "@rx (?i)authorization:\s*bearer" "id:5213,phase:4,pass,msg:'LLM_SECRET_EXFILTRATION'"

# =========================================================
# 4. LLM_TOOL_OUTPUT_ABUSE 5301-5313
# =========================================================

SecRule RESPONSE_BODY "@rx (?i)tool_output.*(secret|token|password|key)" "id:5301,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)tool result.*(secret|token|password)" "id:5302,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)mcp tool.*(credential|env|key)" "id:5303,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)kubectl.*secret" "id:5304,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)docker.*config" "id:5305,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)/etc/passwd" "id:5306,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)\.aws/credentials" "id:5307,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)\.ssh/id_rsa" "id:5308,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)env\s*\|" "id:5309,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)printenv" "id:5310,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)cat\s+/etc/" "id:5311,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)ls\s+/root" "id:5312,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"
SecRule RESPONSE_BODY "@rx (?i)whoami" "id:5313,phase:4,pass,msg:'LLM_TOOL_OUTPUT_ABUSE'"

# =========================================================
# 5. MCP_AUTHZ_SESSION_ABUSE 5401-5413
# =========================================================

SecRule REQUEST_BODY "@rx (?i)\"name\"\s*:\s*\"(admin_|delete_|impersonate)[a-z0-9_]*\"" "id:5401,phase:2,pass,msg:'MCP_ADMIN_TOOL_CALL'"
SecRule REQUEST_BODY "@rx (?i)\"auth\"\s*:\s*\"none\"" "id:5402,phase:2,pass,msg:'MCP_AUTH_BYPASS'"
SecRule REQUEST_BODY "@rx (?i)(all-tenants|cluster-admin|rolebinding|admin_apply_policy)" "id:5403,phase:2,pass,msg:'MCP_PRIVILEGE_ESCALATION'"
SecRule REQUEST_HEADERS:Mcp-Session-Id "@rx (?i)(null|undefined|none|test|debug|admin)" "id:5404,phase:1,pass,msg:'MCP_SUSPICIOUS_SESSION_ID'"
SecRule REQUEST_BODY "@rx (?i)prompts/get" "id:5411,phase:2,pass,msg:'MCP_PROMPT_ACCESS'"
SecRule REQUEST_BODY "@rx (?i)(sampling/createmessage|sampling/create_message|sampling/create-message)" "id:5412,phase:2,pass,msg:'MCP_SAMPLING_REQUEST'"
SecRule REQUEST_BODY "@rx (?i)elicitation/create" "id:5413,phase:2,pass,msg:'MCP_ELICITATION_REQUEST'"

# =========================================================
# 6. REST_API_ABUSE 5501-5506
# =========================================================

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(/api/(proxy|fetch|forward|request|webhook|callback)|169\.254\.169\.254|127\.0\.0\.1|localhost|metadata\.google\.internal)" "id:5501,phase:2,pass,msg:'REST_SSRF'"
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(/api/(export|download|backup|dump|data/bulk)|select\s+\*\s+from|union\s+select|pg_dump|mysqldump|mongoexport)" "id:5502,phase:2,pass,msg:'REST_DATA_EXFILTRATION'"
SecRule REQUEST_HEADERS:Authorization|REQUEST_BODY "@rx (?i)(bearer\s+eyj|refresh_token|access_token|token/(refresh|validate|revoke))" "id:5503,phase:2,pass,msg:'REST_JWT_ABUSE'"
SecRule REQUEST_URI|REQUEST_BODY "@rx (?i)(/api/(login|auth|register|signup)|admin/impersonate|'\\s*or\\s*'1'\\s*=\\s*'1|invalid token|expired token)" "id:5504,phase:2,pass,msg:'REST_AUTH_BYPASS'"
SecRule REQUEST_URI|REQUEST_BODY "@rx (?i)(__schema|__type|introspectionquery|/graphql|/swagger|/openapi|/api-docs|/\\.well-known)" "id:5505,phase:2,pass,msg:'REST_ENDPOINT_PROBING'"
SecRule RESPONSE_STATUS "@streq 429" "id:5506,phase:3,pass,msg:'REST_RATE_LIMIT_ABUSE'"

# =========================================================
# 7. A2A_AGENT_PROTOCOL_ABUSE 5601-5608
# =========================================================

SecRule REQUEST_HEADERS:Content-Type "@contains application/a2a+json" "id:5601,phase:1,pass,msg:'A2A_CONTENT_TYPE'"
SecRule REQUEST_URI "@rx (?i)/\.well-known/agent-card\.json" "id:5602,phase:1,pass,msg:'A2A_AGENT_CARD_DISCOVERY'"
SecRule REQUEST_URI "@rx (?i)/message:(send|stream)" "id:5603,phase:1,pass,msg:'A2A_MESSAGE_SEND'"
SecRule REQUEST_URI "@rx (?i)/tasks(/[^/]+)?(:cancel|:subscribe)?" "id:5604,phase:1,pass,msg:'A2A_TASK_OPERATION'"
SecRule REQUEST_URI "@rx (?i)/extendedAgentCard" "id:5605,phase:1,pass,msg:'A2A_EXTENDED_AGENT_CARD'"
SecRule REQUEST_BODY "@rx (?i)(taskPushNotificationConfig|pushNotificationConfigs|webhook|callback)" "id:5606,phase:2,pass,msg:'A2A_PUSH_NOTIFICATION_CONFIG'"
SecRule RESPONSE_BODY "@rx (?i)(TASK_STATE_AUTH_REQUIRED|credentials|authorization|access_token)" "id:5607,phase:4,pass,msg:'A2A_AUTH_REQUIRED_OR_CREDENTIAL_EXCHANGE'"
SecRule RESPONSE_BODY "@rx (?i)(\"artifacts\"|\"artifactId\").*(https?://|token=|signature=|X-Amz-Signature)" "id:5608,phase:4,pass,msg:'A2A_ARTIFACT_EXTERNAL_URL'"
