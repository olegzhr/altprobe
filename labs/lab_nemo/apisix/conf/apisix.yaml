routes:
  - id: nemo-chat
    uri: /v1/*
    methods:
      - POST
    upstream:
      type: roundrobin
      nodes:
        nemo:8000: 1
    plugins:
      redis-logger:
        output_type: redis
        redis_host: redis
        redis_port: 6379
        redis_key: log_proxy
        gateway_origin_id: nemo-gateway-1
        host_name: nemo-gateway
        max_body_size: 16384
#END
