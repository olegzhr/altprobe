# NeMo Guardrails lab: LangChain agent -> APISIX -> NeMo -> OpenAI-compatible mock.
#
# NeMo applies an input rail. Altprobe consumes the APISIX Redis log, submits
# the captured request/response to NeMo in guard mode, and writes an OCSF 6003
# content assessment.
name: af-lab-nemo

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock:
    build:
      context: ./mock
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4010/v1/models', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 30

  nemo:
    build:
      context: ./nemo
    environment:
      - NEMO_GUARDRAILS_NO_USAGE_STATS=1
    ports:
      - 127.0.0.1:18000:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    depends_on:
      mock:
        condition: service_healthy

  apisix:
    build:
      context: ./apisix
    ports:
      - 127.0.0.1:9080:9080
    healthcheck:
      test: ["CMD", "apisix", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      redis:
        condition: service_healthy
      nemo:
        condition: service_healthy

  agent:
    build:
      context: ./agent
    depends_on:
      apisix:
        condition: service_started
      nemo:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - 127.0.0.1:19200:9200
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|\"status\":\"yellow\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - 127.0.0.1:5601:5601
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  opensearch-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./opensearch:/setup:ro
    environment:
      - OS_URL=http://opensearch:9200
    entrypoint: ["sh", "/setup/setup_templates.sh"]
    restart: "no"

  opensearch-dashboards-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    volumes:
      - ./opensearch:/setup:ro
    environment:
      - OSD_URL=http://opensearch-dashboards:5601
    entrypoint: ["sh", "/setup/setup_dashboards.sh"]
    restart: "no"

  altprobe:
    build:
      context: ../..
      dockerfile: labs/common/altprobe/Dockerfile
      args:
        CRS: 'false'
    image: altprobe-lab-nemo:local
    environment:
      - ALTPROBE_ASSET_NAME=nemo-gateway
      - ALTPROBE_HOST_NAME=nemo-gateway
      - ALTPROBE_PROJECT_ID=demo-project
      - ALTPROBE_LOG_DEBUG=true
      - ALTPROBE_GATEWAY_TYPE=apisix
      - SOURCES_REDIS_HOST=redis
      - SOURCES_REDIS_PORT=6379
      - SOURCES_PROXY_REDIS=log_proxy
      - LLM_GUARD_ENABLED=true
      - LLM_GUARD_PROVIDER=nemo
      - LLM_GUARD_URL=http://nemo:8000
      - LLM_GUARD_CONFIG_ID=altprobe
      - LLM_GUARD_MODEL=gpt-4o-mini
      - LLM_GUARD_INSPECT_REQUEST=true
      - LLM_GUARD_INSPECT_RESPONSE=true
      - LLM_GUARD_TIMEOUT_MS=30000
      - LLM_GUARD_MAX_BODY_BYTES=16384
      - CORRELATOR_DETECTION_ENABLED=true
      - SINKS_OS_URL=http://opensearch:9200
      - SINKS_OS_USER=admin
      - SINKS_OS_PWD=admin
      - SINKS_OS_TLS_VERIFY=false
      - SINKS_OS_TYPES=OCSF
      - SINKS_AF_URL=
      - SINKS_AF_KEY=
    volumes:
      - altprobe-data:/var/lib/altprobe
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      apisix:
        condition: service_started

volumes:
  opensearch-data: {}
  altprobe-data: {}
