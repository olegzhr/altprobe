_format_version: '3.0'
plugins:
- name: altprobe
  config:
    redis_host: redis
    redis_key: log_proxy
    host_name: altprobe-kong-lab
- name: opentelemetry
  config:
    endpoint: http://127.0.0.1:4318/v1/traces
    resource_attributes:
      service.name: kong-native
    batch_flush_delay: 1
services:
- name: mock
  url: http://mock:8000
  routes:
  - name: all
    paths:
    - /
    strip_path: false
    response_buffering: false
- name: ai
  url: http://mock:8000/test-api/v1/chat/completions
  routes:
  - name: ai
    paths:
    - ~/ai-gateway/v1/chat/completions$
    strip_path: true
    regex_priority: 200
    response_buffering: false
