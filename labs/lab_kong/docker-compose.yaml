# =============================================================================
# Altprobe Lab — Kong
#
# Self-contained quick-start demo of Altprobe behind Kong.
#
# Wire-up:
#   curl -> kong:8010 (proxy) -> mock:8000 (MCP / test-api / AI Gateway)
#   kong custom-log-redis -> redis, key "log_proxy"
#   altprobe reads "log_proxy" from redis, normalizes gateway traffic, and
#   forwards demo traces to the collector mock
#   altprobe -> OpenSearch (native sinks.cpp OS sink): OCSF 6003/4002 docs land
#   in daily indices under ocsf-1.1.0-*; the correlator emits OCSF 600301
#   "Agent Correlation" findings browsable in OpenSearch Dashboards.
#
# OpenSearch keeps the normalized OCSF events generated by the demo traffic.
# =============================================================================

services:

  redis:
    image: redis:7-alpine
    container_name: lab-kong-redis
    restart: unless-stopped
    ports:
      # 6379 is commonly taken by a host redis-server; publish on 16379.
      - "16379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock:
    build: ./mock
    container_name: lab-kong-mock
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"   # optional: direct access for debugging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 30

  kong:
    build: ./kong
    container_name: lab-kong-gateway
    depends_on:
      - redis
      - mock
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,custom-log-redis
    ports:
      - "8010:8000"   # proxy entry point
      - "8011:8001"   # admin API
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: lab-kong-opensearch
    restart: unless-stopped
    environment:
      # Single-node, security plugin disabled: throwaway lab cluster with no
      # external exposure beyond localhost. altprobe's sinks.cpp still sends
      # HTTP Basic auth on every write (SINKS_OS_USER/PWD below) because
      # cobject.cpp requires non-empty user/pwd to enable the sink at all —
      # OpenSearch just ignores those credentials with security disabled.
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      # Named volume so indexed OCSF docs survive `docker compose down`
      # (only `down -v` wipes it).
      - opensearch-kong-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|\"status\":\"yellow\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: lab-kong-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards-recover:
        condition: service_completed_successfully
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"   # Web UI — http://localhost:5601
    healthcheck:
      # /api/status answers 503 until the saved-objects migration completes.
      # Gating on this code (instead of service_started) stops OSD from racing
      # OpenSearch's startup and leaving a half-migrated .kibana_1 behind.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  opensearch-dashboards-recover:
    # One-shot: if OpenSearch Dashboards ever started before OpenSearch was
    # ready, it can leave an empty .kibana_1 index carrying a stale "another
    # instance is migrating" marker, which makes /api/status return 503
    # forever. This job deletes that empty index so OSD re-runs its migration
    # cleanly. A populated index (real saved objects) is never touched.
    image: curlimages/curl:8.10.1
    container_name: lab-kong-osd-recover
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./opensearch:/setup:ro
    entrypoint: ["sh", "/setup/recover_stale_kibana.sh"]
    environment:
      - OS_URL=http://opensearch:9200
    restart: "no"

  opensearch-init:
    # One-shot job: registers the OCSF index templates (opensearch/templates/)
    # via setup_templates.sh (epoch_millis time, nested correlation timelines)
    # and ensures an index exists for every class pattern so Dashboards do not
    # warn about missing indices. Applied before altprobe writes.
    image: curlimages/curl:8.10.1
    container_name: lab-kong-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./opensearch:/setup:ro
    entrypoint: ["sh", "/setup/setup_templates.sh"]
    environment:
      - OS_URL=http://opensearch:9200
    restart: "no"

  opensearch-dashboards-init:
    # One-shot job: provisions the index pattern + saved search + dashboard
    # from opensearch/dashboards/ via setup_dashboards.sh. Idempotent
    # (overwrite=true) — safe to rerun.
    image: curlimages/curl:8.10.1
    container_name: lab-kong-dashboards-init
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    volumes:
      - ./opensearch:/setup:ro
    entrypoint: ["sh", "/setup/setup_dashboards.sh"]
    environment:
      - OSD_URL=http://opensearch-dashboards:5601
    restart: "no"

  altprobe:
    build: ./altprobe
    # Pinned to linux/amd64 — the project Makefile hardcodes "Architecture:
    # amd64" in the .deb control file regardless of the host architecture.
    platform: linux/amd64
    container_name: lab-kong-altprobe
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      # Altprobe settings
      - ALTPROBE_ASSET_NAME=altprobe-kong-lab
      - ALTPROBE_HOST_NAME=altprobe-kong-lab
      - ALTPROBE_LOG_DEBUG=true
      - ALTPROBE_API_THRESHOLD=10
      - ALTPROBE_RULESET_PATH=/etc/altprobe/coreruleset
      # Correlator (stock config keys)
      - CORRELATOR_DETECTION_ENABLED=true
      - CORRELATOR_ALIAS_TTL=30
      - CORRELATOR_ALERT_COOLDOWN=30
      - CORRELATOR_ENTITY_TTL=90
      - CORRELATOR_CLEANUP_INTERVAL=100
      # Traces: collect per-agent chains and emit matches to Alertflex.
      - TRACE_ENABLED=true
      - TRACE_AGENT_WINDOW=300
      # Response
      - RESPONSE_ENABLED=false
      # Sinks: defaults point at the lab's own mock, which
      # serves /inventory/{asset} (pattern/trigger delivery) and /traces/{asset}
      # (trace capture). Override with a real collector via
      # ALERTFLEX_URL / ALERTFLEX_KEY in .env or the shell.
      - SINKS_AF_URL=${ALERTFLEX_URL:-http://mock:8000}
      - SINKS_AF_KEY=${ALERTFLEX_KEY:-test-key-not-validated-by-mock}
      # OpenSearch sink (altprobe's native sinks.cpp writer).
      - SINKS_OS_URL=http://opensearch:9200
      - SINKS_OS_USER=admin
      - SINKS_OS_PWD=admin
      - SINKS_LOKI_URL=
      # Sources: read proxy traffic logged by Kong from redis
      - SOURCES_REDIS_HOST=redis
      - SOURCES_REDIS_PORT=6379
      - SOURCES_PROXY_REDIS=log_proxy
      - SOURCES_FALCO_LOG=
      - SOURCES_PROXY_LOG=
      - SOURCES_SURICATA_LOG=
      - SOURCES_ECAPTURE_WS=

volumes:
  opensearch-kong-data:
