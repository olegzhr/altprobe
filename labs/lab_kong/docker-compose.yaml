services:
  redis:
    image: redis:7-alpine
    container_name: demo-kong-redis
    restart: unless-stopped
    ports:
    - 127.0.0.1:16379:6379
    command:
    - redis-server
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 2s
      retries: 30
  mock:
    build: ./mock
    container_name: demo-kong-mock
    environment:
    - LAB_GATEWAY=kong
    - LAB_PROBE_HOST=altprobe-kong-lab
    - LAB_PROFILE=demo
    restart: unless-stopped
    expose:
    - '8000'
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=2).status==200 else 1)
      interval: 3s
      timeout: 3s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: demo-kong-opensearch
    restart: unless-stopped
    environment:
    - discovery.type=single-node
    - DISABLE_SECURITY_PLUGIN=true
    - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
    - 127.0.0.1:9200:9200
    volumes:
    - opensearch-kong-data:/usr/share/opensearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green\|"status":"yellow"'
      interval: 5s
      timeout: 5s
      retries: 40
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: demo-kong-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards-recover:
        condition: service_completed_successfully
    environment:
    - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
    - 127.0.0.1:5601:5601
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status |
        grep -q 200
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  opensearch-dashboards-recover:
    image: curlimages/curl:8.10.1
    container_name: demo-kong-opensearch-dashboards-recover
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
    - ./opensearch:/setup:ro
    entrypoint:
    - sh
    - /setup/recover_stale_kibana.sh
    environment:
    - OS_URL=http://opensearch:9200
    restart: 'no'
  opensearch-init:
    image: curlimages/curl:8.10.1
    container_name: demo-kong-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
    - ./opensearch:/setup:ro
    entrypoint:
    - sh
    - /setup/setup_templates.sh
    environment:
    - OS_URL=http://opensearch:9200
    restart: 'no'
  opensearch-dashboards-init:
    image: python:3.12-slim
    container_name: demo-kong-opensearch-dashboards-init
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    volumes:
    - ./opensearch:/setup:ro
    entrypoint:
    - python3
    - /setup/setup_dashboards.py
    environment:
    - OSD_URL=http://opensearch-dashboards:5601
    restart: 'no'
  altprobe:
    build:
      context: ../..
      dockerfile: labs/lab_kong/altprobe/Dockerfile
      args:
        ALTPROBE_VERSION: ${ALTPROBE_VERSION:-1.0.2}
        ALTPROBE_RELEASE_BASE_URL: ${ALTPROBE_RELEASE_BASE_URL:-https://github.com/olegzhr/altprobe/releases/download}
        ALTPROBE_SHA256: ${ALTPROBE_SHA256:-c89ec517fcd4ff5831cee8cb63f51e8d717f36a274868717177431baa31a0ce8}
        INSTALL_TRIVY: ${LAB_INSTALL_TRIVY:-false}
    platform: linux/amd64
    network_mode: service:kong
    container_name: demo-kong-altprobe
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      kong:
        condition: service_started
      mock:
        condition: service_healthy
    volumes:
    - incident-spool:/var/lib/altprobe
    restart: unless-stopped
    environment:
    - ALTPROBE_ASSET_NAME=altprobe-kong-lab
    - ALTPROBE_HOST_NAME=altprobe-kong-lab
    - ALTPROBE_PROJECT_ID=demo-project
    - ALTPROBE_LOG_DEBUG=true
    - ALTPROBE_API_THRESHOLD=10
    - ALTPROBE_RULESET_PATH=/etc/altprobe/coreruleset
    - ALTPROBE_API_GUARD=/etc/altprobe/api_guard.yaml
    - ALTPROBE_GEOIP_DB=/etc/altprobe/GeoLite2-City-test.mmdb
    - ALTPROBE_SBOM_CONFIG=/etc/altprobe/sbom-test.yaml
    - CORRELATOR_DETECTION_ENABLED=true
    - CORRELATOR_ALIAS_TTL=30
    - CORRELATOR_ALERT_COOLDOWN=30
    - CORRELATOR_ENTITY_TTL=90
    - CORRELATOR_CLEANUP_INTERVAL=100
    - TRACE_ENABLED=true
    - TRACE_AGENT_WINDOW=300
    - POLICY_ENABLED=true
    - POLICY_TYPE_AGENT=kong
    - POLICY_IDENTITY_MODE=authenticated
    - POLICY_UNKNOWN_AGENT=deny
    - POLICY_UNKNOWN_ENDPOINT=deny
    - POLICY_INVENTORY_MAX_AGE_SEC=180
    - POLICY_SIDECAR_HTTP_ENABLED=true
    - POLICY_SIDECAR_HTTP_BIND_HOST=127.0.0.1
    - POLICY_SIDECAR_HTTP_TRUSTED_PEERS=127.0.0.1,::1
    - POLICY_INCIDENT_ENABLED=true
    - POLICY_ALLOW_HTTP=true
    - POLICY_SPOOL_DIR=/var/lib/altprobe/incidents
    - SINKS_AF_TLS_VERIFY=${SINKS_AF_TLS_VERIFY:-false}
    - SINKS_AF_TLS_CA_FILE=${SINKS_AF_TLS_CA_FILE:-}
    - SINKS_OS_TLS_VERIFY=${SINKS_OS_TLS_VERIFY:-false}
    - SINKS_OS_TLS_CA_FILE=${SINKS_OS_TLS_CA_FILE:-}
    - SINKS_AF_URL=${ALERTFLEX_URL:-http://mock:8000}
    - SINKS_AF_KEY=${ALERTFLEX_KEY:-test-key-not-validated-by-mock}
    - SINKS_OS_URL=http://opensearch:9200
    - SINKS_OS_USER=admin
    - SINKS_OS_PWD=admin
    - SINKS_LOKI_URL=
    - SOURCES_REDIS_HOST=redis
    - SOURCES_REDIS_PORT=6379
    - SOURCES_PROXY_REDIS=log_proxy
    - SOURCES_SURICATA_REDIS=log_suricata
    - SOURCES_FALCO_LOG=
    - SOURCES_PROXY_LOG=
    - SOURCES_SURICATA_LOG=
    image: altprobe-demo-kong-collector:local
  kong:
    build: ./kong
    container_name: demo-kong-kong
    depends_on:
    - redis
    - mock
    ports:
    - 127.0.0.1:9080:9080
    restart: unless-stopped
    environment:
      KONG_NGINX_WORKER_PROCESSES: '2'
volumes:
  incident-spool: null
  opensearch-kong-data: null
name: altprobe-demo-kong
