%YAML 1.1
---
# Altprobe correlator scoring weights.
# Values are additive confidence contributions in the 0.0-1.0 range.
# If this file is not configured, altprobe uses the same compiled defaults.
#
# How scoring works:
#   - The correlator accumulates features for an entity (process, host, IP,
#     MCP/A2A object, etc.) inside a time window.
#   - Each observed signal adds a weight from the "signals" section.
#   - Cross-signal combinations add weights from the "chains" section.
#   - Events observed close together add weights from the "temporal" section.
#   - The final score is capped by base.max_score and classified with
#     thresholds.critical/high/medium.
#
# Tuning guidance:
#   - Increase a weight when the signal is reliable and should produce faster
#     HIGH/CRITICAL findings in your environment.
#   - Decrease a weight when the signal is noisy or common in normal traffic.
#   - Keep most individual signal weights below 0.30. Let combinations/chains
#     drive high-confidence findings.
#   - Change thresholds only after reviewing alert volume. Lower thresholds
#     increase sensitivity and false positives; higher thresholds reduce noise
#     but may delay detection.
#   - Use small changes first, for example +/- 0.02 or +/- 0.05.

# Risk classification thresholds for the final score.
# critical: score at or above this value becomes CRITICAL.
# high:     score at or above this value becomes HIGH.
# medium:   score at or above this value becomes MEDIUM.
thresholds:
  critical: 0.90
  high: 0.70
  medium: 0.45

# Base scoring controls.
# max_score:    absolute cap for the final score.
# stage_cap:    maximum bonus from distinct attack-chain stages.
# stage_weight: score added per observed stage until stage_cap is reached.
# sources_2:    bonus when evidence comes from at least two independent sources.
# sources_3:    additional bonus when evidence comes from at least three sources.
base:
  max_score: 1.00
  stage_cap: 0.30
  stage_weight: 0.06
  sources_2: 0.10
  sources_3: 0.05

# Individual signal weights.
# These are added when the corresponding feature is observed. A single signal
# should usually not be enough for CRITICAL by itself; high-confidence detections
# should normally come from signal + chain + temporal correlation.
signals:
  # Runtime/process AI indicators.
  proc_ai: 0.12
  ipc: 0.18

  # MCP protocol and MCP object activity.
  mcp_http: 0.16

  # A2A / Agent2Agent protocol activity.
  a2a_http: 0.14
  a2a_agent_card_change: 0.18
  a2a_message_send_with_runtime: 0.12
  a2a_push_notification: 0.16
  a2a_artifact_exfil: 0.25
  a2a_auth_required: 0.12
  a2a_unknown_agent: 0.20

  # AI provider and AI gateway visibility.
  ai_provider_usage: 0.14
  ai_gateway_context: 0.10

  # Sensitive business data context.
  corporate_data_context: 0.10

  # Tool and prompt-layer threats.
  tool_call: 0.16
  prompt_injection: 0.22
  tool_abuse: 0.22

  # MCP inventory and unknown object risk.
  inventory_discovery: 0.05
  inventory_change: 0.18
  endpoint_drift: 0.18
  unknown_tool: 0.24
  unknown_object: 0.20
  sampling_request: 0.16
  elicitation_request: 0.18

  # Runtime/network escalation and lateral movement.
  shell_network: 0.12
  lateral_movement: 0.25
  secret_or_resource_access: 0.16
  tls_anomaly: 0.12

  # REST/API abuse signals.
  rest_api_calls: 0.08
  rest_auth_failures: 0.18
  rest_data_exfil: 0.25
  rest_rate_limit: 0.12
  rest_endpoint_probe: 0.08
  shadow_api: 0.18
  rest_ssrf: 0.22
  rest_jwt_abuse: 0.10
  user_fraud_context: 0.04

# Chain/correlation weights.
# These represent combinations that are more meaningful than each signal alone,
# for example prompt injection followed by tool execution and network activity.
chains:
  # Runtime + agent protocol + network chains.
  runtime_mcp_network: 0.25
  runtime_a2a_network: 0.22

  # Sensitive data moving toward AI providers or AI gateways.
  corporate_data_provider: 0.16
  corporate_data_gateway: 0.20
  corporate_data_runtime_provider: 0.25

  # Cross-protocol agent workflow chains.
  a2a_mcp_tool: 0.25
  a2a_rest_data: 0.18
  mcp_tool_runtime_network: 0.25

  # Inventory drift and unknown MCP/A2A object risk.
  mcp_unknown_inventory: 0.25
  endpoint_drift_with_activity: 0.18
  inventory_change_with_activity: 0.20

  # Prompt/tool/network attack-chain ordering.
  prompt_tool_network: 0.30
  ordered_prompt_tool_network: 0.20

  # Lateral movement and shell/network behavior.
  lateral_ai_activity: 0.30
  ordered_shell_lateral: 0.15
  multi_stage_tool_pipeline: 0.25
  ordered_llm_mcp_tool: 0.15

  # Fraud-sensitive workflow abuse.
  user_fraud_abuse: 0.20
  user_fraud_auth_failure: 0.12
  user_fraud_data_exfil: 0.12

  # REST/API combined with MCP, A2A, runtime, or secrets/exfiltration.
  rest_mcp: 0.12
  rest_a2a: 0.12
  mcp_a2a: 0.14
  rest_runtime: 0.15
  rest_secret_or_exfil: 0.15
  rest_auth_tool: 0.18

# Temporal correlation weights.
# These are added when related events occur close together. They help distinguish
# normal isolated activity from attack sequences.
temporal:
  # REST activity close to runtime or HTTP events.
  rest_runtime: 0.10
  rest_http: 0.08
  fraud_rest_abuse: 0.10

  # A2A activity close to HTTP or runtime behavior.
  a2a_http: 0.08
  a2a_runtime: 0.10

  # Runtime + HTTP/prompt/tool/TLS ordering.
  runtime_http: 0.10
  prompt_tool: 0.15
  ipc_tls: 0.12

  # Inventory/unknown object timing.
  inventory_unknown: 0.14

  # Sensitive data context close to AI provider or gateway activity.
  corporate_data_provider: 0.12
  corporate_data_gateway: 0.12
