# Versioned API Guard baseline, schema v2. Detection only; no authorization.
# Source of truth for packaged YAML and generated built-in fallback.
# Languages: en, ru, es, zh (Hans/Hant), fr, de, pt, it, ja, ko, ar, hi, tr.
# Language-specific IDs identify the lexicon that matched, not the user's language.
# All groups must match within one normalized scalar and window (UTF-8 bytes).
# Request/result checks run separately. Context and protocol activity are not attacks.
# Confidence expresses evidence strength, not proof of successful exploitation.
# Tune on local traffic before automatic enforcement. Literal phrases are not semantic coverage.
# SQLi/XSS patterns supplement existing ModSecurity/CRS; they do not replace it.
# Regenerate fallback: python3 scripts/generate_api_guard_rules.py
schema_version: 2
ruleset_version: api-guard-baseline-v2.4
rules:
- id: tool.credential_transfer
  kind: threat
  signal: tool_abuse
  fields:
  - request.text
  tools:
  - run_command
  confidence: 90
  window: 256
  reason: Credential file transfer through a command tool; confirm authorization
  all:
  - - curl --data-binary
    - curl --data
    - scp
    - rsync
  - - .aws/credentials
    - credentials
    - service-token
    - private key
- id: data.upload_secret
  kind: threat
  signal: rest_data_exfil
  fields:
  - request.text
  confidence: 85
  window: 256
  reason: Secret material uploaded to an external destination
  all:
  - - upload
    - post
    - send
  - - api key
    - access token
    - secret
