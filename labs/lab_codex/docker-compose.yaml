name: af-lab-codex
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
    - discovery.type=single-node
    - DISABLE_SECURITY_PLUGIN=true
    - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
    - 127.0.0.1:19200:9200
    volumes:
    - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green\|"status":"yellow"'
      interval: 5s
      timeout: 5s
      retries: 60
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
    - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
    - 127.0.0.1:5601:5601
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status |
        grep -q 200
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  opensearch-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
    - ./opensearch:/setup:ro
    environment:
    - OS_URL=http://opensearch:9200
    entrypoint:
    - sh
    - /setup/setup_templates.sh
    restart: 'no'
  opensearch-dashboards-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    volumes:
    - ./opensearch:/setup:ro
    environment:
    - OSD_URL=http://opensearch-dashboards:5601
    entrypoint:
    - sh
    - /setup/setup_dashboards.sh
    restart: 'no'
  agent:
    build:
      context: ./agent
    container_name: lab-codex-agent
    environment:
    - HOME=/home/codex
    - CODEX_HOME=/home/codex/.codex
    - OPENAI_API_KEY=mock
    - OTEL_SERVICE_NAME=codex
    volumes:
    - codex-home:/home/codex
    cap_add:
    - NET_ADMIN
    - NET_RAW
    pid: host
    command:
    - /opt/lab/run.sh
    depends_on:
      mock:
        condition: service_started
  mock:
    image: python:3.12-alpine
    command:
    - python
    - /lab/mock_codex.py
    environment:
    - MOCK_TOOL_COMMAND=curl -k -s --connect-to api.openai.com:443:tls:443 https://api.openai.com/v1/models
      | head -c 80
    volumes:
    - ./mock:/lab:ro
  altprobe:
    build:
      context: ./altprobe
      dockerfile: Dockerfile
    environment:
    - ALTPROBE_ASSET_NAME=lab-codex
    - ALTPROBE_HOST_NAME=lab-codex
    - ALTPROBE_PROJECT_ID=demo-project
    - ALTPROBE_LOG_DEBUG=false
    - SINKS_OS_URL=http://opensearch:9200
    - SINKS_OS_USER=admin
    - SINKS_OS_PWD=admin
    - SINKS_OS_TYPES=OCSF,OTEL
    - SINKS_AF_URL=
    - SINKS_AF_KEY=
    - TRACE_MODE=external
    - SOURCES_OTEL_BIND_HOST=0.0.0.0
    - SOURCES_OTEL_HTTP_PORT=4318
    - SOURCES_OTEL_GRPC_PORT=4317
    - SOURCES_OTEL_TRUSTED_PEERS=172.28.0.10
    - SINKS_TRACE_SPOOL_DIR=/var/lib/altprobe/traces
    - POLICY_ENABLED=false
    volumes:
    - altprobe-data:/var/lib/altprobe
    depends_on:
      opensearch:
        condition: service_healthy
volumes:
  opensearch-data: {}
  lab-home: {}
  altprobe-data: {}
  codex-home: null
networks:
  default:
    ipam:
      config:
      - subnet: 172.28.0.0/24
