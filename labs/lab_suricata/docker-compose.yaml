# Suricata lab: real Suricata captures TLS/DNS/flow traffic, the shared shipper
# forwards events to Redis, and Altprobe writes OCSF 4007/4001/4005.
#
# A small traffic generator creates
# outbound LLM traffic against a local TLS endpoint and DNS server, so the
# Suricata path is the only sensor under test.
#
# Start from this directory:
#   docker compose up -d --build
name: af-lab-suricata

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - 127.0.0.1:16379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - 127.0.0.1:19200:9200
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|\"status\":\"yellow\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - 127.0.0.1:5601:5601
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  opensearch-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./opensearch:/setup:ro
    environment:
      - OS_URL=http://opensearch:9200
    entrypoint: ["sh", "/setup/setup_templates.sh"]
    restart: "no"

  opensearch-dashboards-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    volumes:
      - ./opensearch:/setup:ro
    environment:
      - OSD_URL=http://opensearch-dashboards:5601
    entrypoint: ["sh", "/setup/setup_dashboards.sh"]
    restart: "no"

  # Local DNS endpoint. Suricata sees the UDP/53 query on the traffic
  # container's interface; CoreDNS answers every A query with the TLS IP.
  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
    networks:
      default:
        ipv4_address: 172.28.0.20

  # Local TLS endpoint with SNI api.anthropic.com, so no external provider is
  # contacted. Suricata records the ClientHello SNI.
  tls:
    build:
      context: ./tls
    networks:
      default:
        ipv4_address: 172.28.0.30

  # Generates traffic on the lab bridge; Suricata runs on the host network and
  # captures that bridge directly (br-<network-id>).
  traffic:
    build:
      context: ./traffic
    image: altprobe-lab-suricata-traffic:local
    environment:
      - LAB_RUN_ID=${LAB_RUN_ID:-manual}
    depends_on:
      dns:
        condition: service_started
      tls:
        condition: service_started

  suricata:
    build:
      context: ./suricata
    image: altprobe-lab-suricata-engine:local
    privileged: true
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW", "SYS_NICE"]
    depends_on:
      traffic:
        condition: service_started
    volumes:
      - suricata-logs:/var/log/suricata
    healthcheck:
      test: ["CMD-SHELL", "grep -q '\"event_type\":\"tls\"' /var/log/suricata/eve.json"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  # Shared connector tails only Suricata eve.json and pushes each selected
  # event type to the Redis list consumed by Altprobe.
  shipper:
    build:
      context: ../../connectors/shipper_altprobe
      dockerfile: Dockerfile
    command: ["--config", "/etc/shipper/config.json"]
    volumes:
      - ./shipper/config.json:/etc/shipper/config.json:ro
      - suricata-logs:/var/log/suricata:ro
    depends_on:
      redis:
        condition: service_healthy
      suricata:
        condition: service_healthy

  altprobe:
    build:
      context: ../..
      dockerfile: labs/common/altprobe/Dockerfile
      args:
        CRS: 'false'
    image: altprobe-lab-suricata:local
    environment:
      - ALTPROBE_ASSET_NAME=suricata-node
      - ALTPROBE_HOST_NAME=suricata-node
      - ALTPROBE_PROJECT_ID=demo-project
      - ALTPROBE_LOG_DEBUG=false
      - SOURCES_REDIS_HOST=redis
      - SOURCES_REDIS_PORT=6379
      - SOURCES_SURICATA_REDIS=log_suri
      - CORRELATOR_OUTBOUND_ENABLED=true
      - CORRELATOR_OUTBOUND_SETTLE_MS=3000
      - SINKS_OS_URL=http://opensearch:9200
      - SINKS_OS_USER=admin
      - SINKS_OS_PWD=admin
      - SINKS_OS_TYPES=OCSF
      - SINKS_AF_URL=
      - SINKS_AF_KEY=
    volumes:
      - altprobe-data:/var/lib/altprobe
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      shipper:
        condition: service_started

volumes:
  opensearch-data: {}
  suricata-logs: {}
  altprobe-data: {}

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
