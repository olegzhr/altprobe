worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    lua_package_path "/etc/openresty/lua/?.lua;;";
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log /dev/stdout;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    server {
        listen 9080;
        location = /health { return 200 "ok\n"; }
        # AI Gateway demo route: the client-facing path is namespaced as
        # /ai-gateway and rewritten to the mock's OpenAI-compatible endpoint,
        # exactly like the APISIX ai-proxy and Envoy labs.
        location /ai-gateway/ {
            access_by_lua_file /etc/openresty/lua/access.lua;
            body_filter_by_lua_file /etc/openresty/lua/capture.lua;
            log_by_lua_file /etc/openresty/lua/log.lua;
            proxy_pass http://mock:8000/test-api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location / {
            access_by_lua_file /etc/openresty/lua/access.lua;
            body_filter_by_lua_file /etc/openresty/lua/capture.lua;
            log_by_lua_file /etc/openresty/lua/log.lua;
            proxy_pass http://mock:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header apikey "";
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Authenticated-Principal "";
        }
    }
}
