worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    lua_package_path "/etc/openresty/lua/?.lua;;";
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log /dev/stdout;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    server {
        listen 9080;
        location = /health { return 200 "ok\n"; }
        # Policy routes: Lua authentication + OPA-compatible decision from the
        # loopback Altprobe sidecar (127.0.0.1:8181). See lua/policy.lua and the
        # "Policy on the proxy side" section in README.md.
        location ~ ^/(policy-check|policy-other|policy-unknown)$ {
            access_by_lua_file /etc/openresty/lua/policy.lua;
            body_filter_by_lua_file /etc/openresty/lua/capture.lua;
            log_by_lua_file /etc/openresty/lua/log.lua;
            proxy_pass http://mock:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header apikey "";
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Authenticated-Principal "";
        }
        # Detector/demo routes are open telemetry paths; Policy is enforced only
        # on the dedicated policy routes above.
        location / {
            # AI Gateway alias, same as the APISIX and Envoy labs.
            rewrite ^/ai-gateway/v1/chat/completions$ /test-api/v1/chat/completions break;
            access_by_lua_file /etc/openresty/lua/capture_request.lua;
            body_filter_by_lua_file /etc/openresty/lua/capture.lua;
            log_by_lua_file /etc/openresty/lua/log.lua;
            proxy_pass http://mock:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header apikey "";
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Authenticated-Principal "";
        }
    }
}
