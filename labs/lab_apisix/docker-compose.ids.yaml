# Optional Suricata replay; the lab installs the published Altprobe release package.
services:
  altprobe:
    environment:
      SOURCES_REDIS_HOST: redis
      SOURCES_REDIS_PORT: '6379'
      SOURCES_SURICATA_REDIS: log_suri
      SOURCES_SURICATA_LOG: ''
  ids-replay:
    image: python:3.12-alpine
    profiles:
    - ids-test
    volumes:
    - ../ids:/ids:ro
    entrypoint:
    - python
    - /ids/replay.py
    environment:
      REDIS_HOST: redis
      OS_URL: http://opensearch:9200
    depends_on:
      altprobe:
        condition: service_started
