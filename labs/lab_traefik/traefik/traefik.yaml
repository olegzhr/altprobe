entryPoints:
  web:
    address: :9080
providers:
  file:
    filename: /etc/traefik/dynamic.yaml
experimental:
  localPlugins:
    altprobe:
      moduleName: github.com/altprobe/traefik-altprobe
log:
  level: INFO
tracing:
  serviceName: traefik-native
  sampleRate: 1.0
  otlp:
    http:
      endpoint: http://127.0.0.1:4318/v1/traces
