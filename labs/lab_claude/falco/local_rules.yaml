# Лабораторные правила: фиксируем исходящие connect на 443 и spawn процессов,
# чтобы восстановить цепочку предков агент → shell → curl без опоры на контейнер.
- rule: Lab capture outbound 443
  desc: Capture outbound TLS connects for the Prempti correlation lab
  condition: evt.type = connect and fd.sport = 443
  output: "lab connect %evt.type cip=%fd.cip sip=%fd.sip cport=%fd.cport sport=%fd.sport proto=%fd.l4proto rawres=%evt.rawres server=%fd.is_server pid=%proc.pid ppid=%proc.ppid name=%proc.name"
  priority: NOTICE
  tags: [lab]

- rule: Lab capture process spawn
  desc: Capture process spawns to rebuild the pid tree
  condition: evt.type in (execve, execveat, clone, clone3, fork, vfork)
  output: "lab proc %evt.type pid=%proc.pid ppid=%proc.ppid name=%proc.name"
  priority: NOTICE
  tags: [lab]
