# Falco для лаборатории: JSON-события в файл, который читает shipper.
engine:
  kind: modern_ebpf

rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

json_output: true
json_include_output_property: true
log_stderr: false
log_syslog: false
priority: notice

stdout_output:
  enabled: false

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco/events.json
