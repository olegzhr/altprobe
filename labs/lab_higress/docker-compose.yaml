services:
  redis:
    image: redis:7-alpine
    container_name: demo-higress-redis
    restart: unless-stopped
    ports:
    - 127.0.0.1:16379:6379
    command:
    - redis-server
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 2s
      retries: 30
  mock:
    build: ./mock
    container_name: demo-higress-mock
    environment:
    - LAB_GATEWAY=higress
    - LAB_PROBE_HOST=altprobe-higress-lab
    - LAB_PROFILE=demo
    restart: unless-stopped
    expose:
    - '8000'
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200
        else 1)
      interval: 3s
      timeout: 3s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: demo-higress-opensearch
    restart: unless-stopped
    environment:
    - discovery.type=single-node
    - DISABLE_SECURITY_PLUGIN=true
    - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
    - 127.0.0.1:9200:9200
    volumes:
    - opensearch-higress-data:/usr/share/opensearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green\|"status":"yellow"'
      interval: 5s
      timeout: 5s
      retries: 40
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: demo-higress-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards-recover:
        condition: service_completed_successfully
    environment:
    - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  opensearch-dashboards-recover:
    image: curlimages/curl:8.10.1
    container_name: demo-higress-opensearch-dashboards-recover
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
    - ./opensearch:/setup:ro
    entrypoint:
    - sh
    - /setup/recover_stale_kibana.sh
    environment:
    - OS_URL=http://opensearch:9200
    restart: 'no'
  opensearch-init:
    image: curlimages/curl:8.10.1
    container_name: demo-higress-opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
    - ./opensearch:/setup:ro
    entrypoint:
    - sh
    - /setup/setup_templates.sh
    environment:
    - OS_URL=http://opensearch:9200
    restart: 'no'
  opensearch-dashboards-init:
    image: python:3.12-slim
    container_name: demo-higress-opensearch-dashboards-init
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    volumes:
    - ./opensearch:/setup:ro
    entrypoint:
    - python3
    - /setup/setup_dashboards.py
    environment:
    - OSD_URL=http://opensearch-dashboards:5601
    restart: 'no'
  altprobe:
    build:
      context: ../..
      dockerfile: labs/lab_higress/altprobe/Dockerfile
      args:
        ALTPROBE_VERSION: ${ALTPROBE_VERSION:-1.0.2}
        ALTPROBE_RELEASE_BASE_URL: ${ALTPROBE_RELEASE_BASE_URL:-https://github.com/olegzhr/altprobe/releases/download}
        ALTPROBE_SHA256: ${ALTPROBE_SHA256:-9d4106796e7bf16bbd9b789aae7c3c36742c4b2a82f69a5dd94b11a1f5b2e25a}
        INSTALL_TRIVY: ${LAB_INSTALL_TRIVY:-false}
        ALTPROBE_PACKAGE_URL: ${ALTPROBE_PACKAGE_URL:-}
    platform: linux/amd64
    network_mode: service:higress
    container_name: demo-higress-altprobe
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      higress:
        condition: service_started
      mock:
        condition: service_healthy
      opensearch-dashboards-init:
        condition: service_completed_successfully
    volumes:
    - trace-spool:/var/lib/altprobe
    restart: unless-stopped
    environment:
      ALTPROBE_ASSET_NAME: altprobe-higress-lab
      ALTPROBE_HOST_NAME: altprobe-higress-lab
      ALTPROBE_PROJECT_ID: demo-project
      ALTPROBE_LOG_DEBUG: 'true'
      ALTPROBE_RULESET_PATH: /etc/altprobe/coreruleset
      ALTPROBE_API_GUARD: /etc/altprobe/api_guard.yaml
      ALTPROBE_SBOM_CONFIG: /etc/altprobe/sbom-test.yaml
      CORRELATOR_DETECTION_ENABLED: 'true'
      CORRELATOR_ALIAS_TTL: '30'
      CORRELATOR_ALERT_COOLDOWN: '30'
      CORRELATOR_ENTITY_TTL: '90'
      CORRELATOR_CLEANUP_INTERVAL: '100'
      SINKS_AF_TLS_VERIFY: ${SINKS_AF_TLS_VERIFY:-false}
      SINKS_AF_TLS_CA_FILE: ${SINKS_AF_TLS_CA_FILE:-}
      SINKS_OS_TLS_VERIFY: ${SINKS_OS_TLS_VERIFY:-false}
      SINKS_OS_TLS_CA_FILE: ${SINKS_OS_TLS_CA_FILE:-}
      SINKS_AF_URL: ${ALERTFLEX_URL:-http://mock:8000}
      SINKS_AF_KEY: ${ALERTFLEX_KEY:-test-key-not-validated-by-mock}
      SINKS_OS_URL: http://opensearch:9200
      SINKS_OS_USER: admin
      SINKS_OS_PWD: admin
      SINKS_LOKI_URL: ''
      SOURCES_REDIS_HOST: redis
      SOURCES_REDIS_PORT: '6379'
      SOURCES_PROXY_REDIS: log_proxy
      SOURCES_PROXY_LOG: ''
      TRACE_MODE: internal
      SINKS_OS_TYPES: OCSF,HTTP,OTEL
      SINKS_TRACE_SPOOL_DIR: /var/lib/altprobe/traces
    image: altprobe-lab-higress:local
  higress:
    build: ./higress
    container_name: demo-higress-higress
    depends_on:
    - redis
    - mock
    - telemetry
    ports:
    - 127.0.0.1:9080:9080
    restart: unless-stopped
    volumes:
    - ./higress/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command:
    - -c
    - /etc/envoy/envoy.yaml
    - --concurrency
    - '2'
  telemetry:
    image: python:3.12-slim
    command:
    - python
    - /app/collector.py
    volumes:
    - ./higress/collector.py:/app/collector.py:ro
    environment:
      REDIS_HOST: redis
      REDIS_KEY: log_proxy
    depends_on:
    - redis
    restart: unless-stopped
  altprobe-otel:
    image: altprobe-lab-higress:local
    build:
      context: ../..
      dockerfile: labs/lab_higress/altprobe/Dockerfile
      args:
        ALTPROBE_VERSION: ${ALTPROBE_VERSION:-1.0.2}
        ALTPROBE_RELEASE_BASE_URL: ${ALTPROBE_RELEASE_BASE_URL:-https://github.com/olegzhr/altprobe/releases/download}
        ALTPROBE_SHA256: ${ALTPROBE_SHA256:-9d4106796e7bf16bbd9b789aae7c3c36742c4b2a82f69a5dd94b11a1f5b2e25a}
        INSTALL_TRIVY: ${LAB_INSTALL_TRIVY:-false}
        ALTPROBE_PACKAGE_URL: ${ALTPROBE_PACKAGE_URL:-}
    container_name: lab-higress-altprobe-otel
    network_mode: service:higress
    depends_on:
      higress:
        condition: service_started
      opensearch-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
    - native-trace-spool:/var/lib/altprobe
    environment:
      ALTPROBE_ASSET_NAME: higress-native
      ALTPROBE_HOST_NAME: higress-native
      ALTPROBE_PROJECT_ID: demo-project
      ALTPROBE_LOG_DEBUG: 'false'
      TRACE_MODE: external
      SINKS_TRACE_SPOOL_DIR: /var/lib/altprobe/traces
      SOURCES_OTEL_BIND_HOST: 127.0.0.1
      SOURCES_OTEL_HTTP_PORT: '4318'
      SOURCES_OTEL_GRPC_PORT: '4317'
      SOURCES_OTEL_TRUSTED_PEERS: 127.0.0.1,::1
      SINKS_AF_URL: ''
      SINKS_AF_KEY: ''
      SINKS_OS_URL: http://opensearch:9200
      SINKS_OS_USER: admin
      SINKS_OS_PWD: admin
      SINKS_OS_TLS_VERIFY: 'false'
      SINKS_OS_TYPES: OTEL
      SOURCES_PROXY_REDIS: ''
      SOURCES_PROXY_LOG: ''
      ALTPROBE_SBOM_CONFIG: ''
  dashboard-ui:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    ports:
    - 127.0.0.1:5601:5601
    volumes:
    - ./opensearch/ui/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./opensearch/ui:/usr/share/nginx/html/altprobe-theme:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:5601/api/status
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  opensearch-higress-data: null
  trace-spool: null
  native-trace-spool: null
name: altprobe-demo-higress
