static_resources:
  listeners:
  - name: http
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: higress
          route_config:
            name: local
            virtual_hosts:
            - name: all
              domains:
              - '*'
              routes:
              - match:
                  path: /ai-gateway/v1/chat/completions
                route:
                  cluster: mock
                  prefix_rewrite: /test-api/v1/chat/completions
                  timeout: 0s
              - match:
                  prefix: /
                route:
                  cluster: mock
                  timeout: 0s
          http_filters:
          - name: envoy.filters.http.wasm
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              config:
                name: altprobe
                root_id: altprobe
                vm_config:
                  vm_id: altprobe
                  runtime: envoy.wasm.runtime.v8
                  code:
                    local:
                      filename: /etc/envoy/altprobe.wasm
                configuration:
                  '@type': type.googleapis.com/google.protobuf.StringValue
                  value: '{"gateway_origin_id": "higress-lab-1", "host_name": "altprobe-higress-lab", "max_body_size": 5000, "collector_cluster": "telemetry",
                    "timeout_ms": 2000}'
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing:
            random_sampling:
              value: 100
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                '@type': type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: altprobe_otel
                  timeout: 2s
                service_name: higress-native
  clusters:
  - name: mock
    connect_timeout: 2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: mock
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mock
                port_value: 8000
  - name: telemetry
    connect_timeout: 2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: telemetry
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: telemetry
                port_value: 8080
  - name: altprobe_otel
    type: STATIC
    connect_timeout: 2s
    http2_protocol_options: {}
    load_assignment:
      cluster_name: altprobe_otel
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 4317
