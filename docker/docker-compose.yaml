services:
  altprobe:
    build:
      context: .
      args:
        ALTPROBE_VERSION: ${ALTPROBE_VERSION:-1.0.2}
        ALTPROBE_RELEASE_BASE_URL: ${ALTPROBE_RELEASE_BASE_URL:-https://github.com/olegzhr/altprobe/releases/download}
        ALTPROBE_SHA256: ${ALTPROBE_SHA256:-d68fc81bce31321bf428444a4fa02868b0ea68e4e34b32c7b9a2e7fb8f91f3bb}
    platform: linux/amd64
    image: altprobe/altprobe:latest
    container_name: altprobe
    environment:
      # Collector settings (Docker mode)
      - ALTPROBE_ASSET_NAME=my-server
      - ALTPROBE_HOST_NAME=my-server
      - ALTPROBE_PROJECT_ID=demo-project
      - ALTPROBE_LOG_DEBUG=true
      - ALTPROBE_API_THRESHOLD=10
      - ALTPROBE_API_GUARD=/etc/altprobe/api_guard.yaml
      - ALTPROBE_RULESET_PATH=/etc/altprobe/coreruleset
      - ALTPROBE_SCORING_WEIGHTS=/etc/altprobe/scoring_weights.yaml
      - ALTPROBE_SBOM_CONFIG=/etc/altprobe/sbom.yaml

      # Correlator
      - CORRELATOR_DETECTION_ENABLED=true
      - CORRELATOR_ALIAS_TTL=30
      - CORRELATOR_ALERT_COOLDOWN=30
      - CORRELATOR_ENTITY_TTL=90
      - CORRELATOR_CLEANUP_INTERVAL=100

      # Trace: per-entity event chains (identity is the auth key, else source IP)
      - TRACE_ENABLED=true

      # Sinks (leave af/os empty to disable)
      - SINKS_AF_URL=
      - SINKS_AF_KEY=
      - SINKS_AF_TLS_VERIFY=false
      - SINKS_AF_TLS_CA_FILE=
      - SINKS_OS_URL=                 # example: "https://opensearch:9200"
      - SINKS_OS_USER=
      - SINKS_OS_PWD=
      - SINKS_OS_TLS_VERIFY=false
      - SINKS_OS_TLS_CA_FILE=
      - SINKS_LOGS_REJECTED_DIR=/var/lib/altprobe/logs-rejected

      # Sources: gateway/proxy telemetry from the redis service
      - SOURCES_REDIS_HOST=redis
      - SOURCES_REDIS_PORT=6379
      - SOURCES_PROXY_REDIS=log_proxy
      # Altprobe reads a log file instead of Redis when this is non-empty.
      - SOURCES_PROXY_LOG=

      # Policy controller (disabled by default; see the gateway lab examples)
      - POLICY_ENABLED=false
      - POLICY_TYPE_AGENT=apisix
      # Identity is the gateway-authenticated consumer, else the observed source IP.
      - POLICY_UNKNOWN_AGENT=deny
      - POLICY_UNKNOWN_ENDPOINT=allow
      - POLICY_INVENTORY_MAX_AGE_SEC=180
      - POLICY_INCIDENT_ENABLED=false
      - POLICY_INCIDENT_URL=
      - POLICY_SPOOL_DIR=/var/lib/altprobe/incidents
      - POLICY_TIMEOUT_MS=5000
      - POLICY_MAX_PENDING=512
      - POLICY_ALLOW_HTTP=false

      # guard_llm (disabled by default; see src/doc/guard_llm.md)
      - GUARD_LLM_ENABLED=false
      - GUARD_LLM_URL=http://host.docker.internal:11434
      - GUARD_LLM_MODEL=
      - GUARD_LLM_FORMAT=qwen3guard
      - GUARD_LLM_INSPECT_REQUEST=true
      - GUARD_LLM_INSPECT_RESPONSE=true
      - GUARD_LLM_TLS_VERIFY=true
      - GUARD_LLM_TLS_CA_FILE=
      - GUARD_LLM_TIMEOUT_MS=10000
      - GUARD_LLM_MAX_BODY_BYTES=16384
      - GUARD_LLM_QUEUE_SIZE=128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: altprobe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # volumes:
    #   - redis_data:/data

# volumes:
#   redis_data:
