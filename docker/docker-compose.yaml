services:
  altprobe:
    image: altprobe/altprobe:latest
    container_name: altprobe
    environment:
      # Altprobe settings
      - ALTPROBE_ASSET_NAME=my-server
      - ALTPROBE_HOST_NAME=my-server
      - ALTPROBE_LOG_DEBUG=true
      - ALTPROBE_API_THRESHOLD=10

      # Correlator
      - CORRELATOR_DETECTION_ENABLED=true
      - CORRELATOR_ALIAS_TTL=30
      - CORRELATOR_ALERT_COOLDOWN=30
      - CORRELATOR_ENTITY_TTL=90
      - CORRELATOR_CLEANUP_INTERVAL=100

      # Response (Suricata or stdio_proxy)
      - RESPONSE_ENABLED=false
      - RESPONSE_BACKEND=suricata
      - RESPONSE_SURICATA_SOCKET=
      - RESPONSE_HOSTBIT_RULE=
      - RESPONSE_IPBLOCK_TIMEOUT=3600
      - RESPONSE_STDIO_PROXY_SOCKET=

      # Sinks (leave af/os/loki empty to disable)
      - SINKS_OUTPUT_MODE=all
      - SINKS_AF_URL=
      - SINKS_AF_KEY=
      - SINKS_OS_URL="https://192.168.1.30:9200"
      - SINKS_OS_USER=admin
      - SINKS_OS_PWD=Password-12345
      - SINKS_LOKI_URL=

      # Sources (Redis ingestion from the redis service)
      - SOURCES_REDIS_HOST=redis
      - SOURCES_REDIS_PORT=6379
      - SOURCES_FALCO_REDIS=log_falco
      - SOURCES_PROXY_REDIS=log_proxy
      - SOURCES_SURICATA_REDIS=log_suri
      # Altprobe reads log files instead of Redis when these are non-empty.
      - SOURCES_FALCO_LOG=
      - SOURCES_PROXY_LOG=
      - SOURCES_SURICATA_LOG=
      - SOURCES_ECAPTURE_WS=
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: altprobe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
