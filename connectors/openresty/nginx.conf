# OpenResty (nginx + Lua) -> Altprobe gateway log connector.
#
# nginx proxies traffic and, in the access/body/log phases, stages request and
# response data that lua/log.lua ships to Redis for Altprobe's proxy (Redis)
# source (SOURCES_PROXY_REDIS). Point proxy_pass at your application upstream.
#
# Install: copy this file to /usr/local/openresty/nginx/conf/nginx.conf and the
# lua/ directory to /etc/openresty/lua in your OpenResty image.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    lua_package_path "/etc/openresty/lua/?.lua;;";
    # Docker's embedded DNS; point at your resolver in other environments.
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log /dev/stdout;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    server {
        listen 9080;
        location / {
            access_by_lua_file /etc/openresty/lua/access.lua;
            body_filter_by_lua_file /etc/openresty/lua/capture.lua;
            log_by_lua_file /etc/openresty/lua/log.lua;
            proxy_pass http://BACKEND:8000;   # your application upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
